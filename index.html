/* ---------- Bausteine einer Station ---------- */
function bausteinHTML(b){
  switch(b.art){
    /* Zitat. Ist ein Urheber angegeben, kommt zwischen Zitat und Namen
       eine kleine Wellenlinie.                                          */
    case "zitat":
      return '<blockquote class="baustein zitat">„' + sicher(b.text) + '”' +
             (b.von
               ? '<span class="zitat-welle" aria-hidden="true">' +
                   '<svg viewBox="0 0 64 8" preserveAspectRatio="none">' +
                   '<path d="M0 4 Q4 0 8 4 T16 4 T24 4 T32 4 T40 4 T48 4 T56 4 T64 4"/>' +
                   "</svg></span>" +
                 "<cite>" + sicher(b.von) + "</cite>"
               : "") + "</blockquote>";
    case "notiz":
      return '<div class="baustein notiz"><b>' + sicher(b.titel || "Notiz") + "</b>" +
             sicher(b.text) + "</div>";
    /* Tiere zum Aufklappen: erst nur Emoji und Name, die Geschichte
       kommt erst beim Antippen. "unsicher" setzt einen kleinen Vermerk. */
    /* "tiere" und "klapp" bauen dieselbe Klappliste. Der Unterschied ist
       nur das Feld, in dem die Einträge stehen: "tiere" oder "punkte".  */
    /* Raten: lauter Felder mit einem Fragezeichen. Erst beim Antippen
       kommt das Emoji zum Vorschein. Darunter ein breiter Balken, der
       einen ganzen Text freigibt.                                     */
    case "tiere":
    case "raten": {
      const felder = b.tiere || b.felder || [];
      const balken = [].concat(b.balken || []);
      return '<div class="baustein notiz raten"><b>' + sicher(b.titel || "Raten") + "</b>" +
             (b.text ? '<p class="raten-vorspann">' + sicher(b.text) + "</p>" : "") +
             (felder.length
               ? '<div class="raten-gitter">' +
                 felder.map(t =>
                   '<button type="button" class="raten-feld" data-raten>' +
                     '<span class="raten-frage" aria-hidden="true">?</span>' +
                     '<span class="raten-loesung">' +
                       '<span class="raten-emoji" aria-hidden="true">' + sicher(t.emoji || "🐾") + "</span>" +
                       '<span class="raten-name">' + sicher(t.name) + "</span>" +
                       (t.spezies ? '<span class="raten-spezies">' + sicher(t.spezies) + "</span>" : "") +
                     "</span>" +
                   "</button>").join("") +
                 "</div>"
               : "") +
             balken.map(txt =>
               '<button type="button" class="raten-balken" data-raten>' +
                 '<span class="raten-frage" aria-hidden="true">?</span>' +
                 '<span class="raten-loesung">' + sicher(txt) + "</span>" +
               "</button>").join("") +
             "</div>";
    }
    case "klapp": {
      const eintraege = b.tiere || b.punkte || [];
      return '<div class="baustein notiz klapp"><b>' + sicher(b.titel || "Zum Aufklappen") + "</b>" +
             (b.text ? '<p class="klapp-vorspann">' + sicher(b.text) + "</p>" : "") +
             '<ul class="klapp-liste">' +
             eintraege.map(t =>
               "<li><details><summary>" +
               (t.emoji ? '<span class="klapp-emoji" aria-hidden="true">' + sicher(t.emoji) + "</span>" : "") +
               '<span class="klapp-name">' + sicher(t.name || t.titel) + "</span>" +
               (t.unsicher ? '<span class="klapp-unsicher">nachfragen</span>' : "") +
               '<span class="klapp-pfeil" aria-hidden="true"></span>' +
               "</summary><p>" + sicher(t.text) + "</p></details></li>").join("") +
             "</ul>" +
             (b.nachsatz ? '<p class="klapp-nachsatz">' + sicher(b.nachsatz) + "</p>" : "") +
             "</div>";
    }
    case "frage":
      return '<div class="baustein frage">' +
             '<p class="frage-text">' + sicher(b.text) + "</p>" +
             '<button class="frage-knopf" type="button" data-frage>Antwort zeigen</button>' +
             '<p class="antwort" hidden>' + sicher(b.antwort) + "</p></div>";
    case "audio":
      return '<div class="baustein notiz"><b>' + sicher(b.titel || "Tonaufnahme") + "</b>" +
             '<audio controls preload="none" src="' + sicher(b.quelle) + '"></audio></div>';
    case "video": {
      const q = String(b.quelle || "");
      let spieler;
      // YouTube- oder Vimeo-Link erkennen und einbetten
      const yt = q.match(/(?:youtu\.be\/|v=)([\w-]{11})/);
      const vi = q.match(/vimeo\.com\/(\d+)/);
      if(yt){
        spieler = '<div class="film-rahmen"><iframe src="https://www.youtube-nocookie.com/embed/' + yt[1] +
                  '" allow="fullscreen; picture-in-picture" loading="lazy" title="' + sicher(b.titel || "Film") + '"></iframe></div>';
      }else if(vi){
        spieler = '<div class="film-rahmen"><iframe src="https://player.vimeo.com/video/' + vi[1] +
                  '" allow="fullscreen" loading="lazy" title="' + sicher(b.titel || "Film") + '"></iframe></div>';
      }else{
        spieler = '<video controls preload="none"' +
                  (b.vorschaubild ? ' poster="' + sicher(b.vorschaubild) + '"' : "") +
                  ' src="' + sicher(q) + '"></video>';
      }
      return '<div class="baustein notiz"><b>' + sicher(b.titel || "Film") + "</b>" + spieler +
             (b.text ? '<p style="margin:10px 0 0">' + sicher(b.text) + "</p>" : "") + "</div>";
    }
    case "abstand":
      return abstandHTML(b);
    case "galerie":
      return galerieHTML(b);
    case "europa":
      return europaHTML(b);
    case "route":
      return routeHTML(b);
    case "ort":
      return '<div class="baustein"><a class="ortslink" target="_blank" rel="noopener" href="https://www.openstreetmap.org/search?query=' +
             encodeURIComponent(b.suche || "") + '">' + sicher(b.text || "Auf der Karte ansehen") + " ↗</a></div>";
    default:
      return "";
  }
}

/* Knopf, der von einer Station in den Stammbaum oder auf die Karte führt. */
function sprungHTML(s){
  if(s.person){
    return '<button type="button" class="sprung" data-sprung="person" data-ziel="' +
           sicher(s.person) + '">Im Stammbaum ansehen</button>';
  }
  if(s.ortId){
    /* ortId darf eine Kennung sein oder mehrere in eckigen Klammern */
    const ziele = Array.isArray(s.ortId) ? s.ortId : [s.ortId];
    return ziele.map(id => {
      const o = (DATEN.orte || []).find(x => x.id === id);
      return '<button type="button" class="sprung" data-sprung="ort" data-ziel="' + sicher(id) +
             '">' + (o ? sicher(o.name) : "Ort") + "</button>";
    }).join("");
  }
  return "";
}

/* ---------- Zeitstrahl ---------- */
function strahlAufbauen(){
  const ziel = $("#zeitstrahl");
  /* Immer dieselbe "Unordnung": Werte aus dem Index berechnet, nicht zufällig. */
  const streuung = (i) => {
    const w = (n, a, b) => a + (Math.abs(Math.sin((i + 1) * n)) * (b - a));
    const schmal = (i % 5 === 2);         // ab und zu eine schmalere Station
    return "--rahmen-dreh:" + w(12.9898, -4.6, 4.6).toFixed(2) + "deg;" +
           "--stempel-dreh:" + w(78.233, -7, 7).toFixed(2) + "deg;" +
           "--band-l:" + w(4.898, -44, -8).toFixed(1) + "deg;" +
           "--band-r:" + w(9.11, 7, 43).toFixed(1) + "deg;" +
           "--schub:" + w(3.77, -10, 10).toFixed(0) + "px;" +
           "--breite:" + (schmal ? "78" : w(6.41, 88, 100).toFixed(1)) + "%;" +
           "--luft:" + w(2.13, 38, 60).toFixed(0) + "px;" +   /* Abstand zwischen den Stationen */
           "--einzug:" + w(7.53, 0, 26).toFixed(0) + "px;" +
           "--rand:" + w(5.19, 9, 22).toFixed(0) + "px;" +
           "--alterung:" + w(8.31, .06, .28).toFixed(2) + ";" +
           "--schild-dreh:" + w(1.77, -1.6, 1.6).toFixed(2) + "deg;" +
           "--verhaeltnis:" + [ "4/3", "1/1", "5/4", "3/4", "16/10", "4/5", "3/2" ][i % 7] + ";";
  };

  /* Eine einzelne Bildfläche – entweder ein Foto oder der Platzhalter.
     Die Dateinamen stehen schon alle drin. Solange eine Datei fehlt,
     zeigt die Fläche den Platzhalter; sobald du das Foto unter genau
     diesem Namen in den Ordner "bilder" legst, ist es da.              */
  const flaeche = (quelle, beschreibung, faul) =>
    quelle
      ? '<img class="bild-flaeche" src="' + sicher(quelle) + '" alt="' + sicher(beschreibung) + '"' +
        (faul ? ' loading="lazy"' : "") + ' onerror="bildFehlt(this)">'
      : '<div class="bild-flaeche bild-platzhalter">Hier kommt ein Foto hin</div>';

  /* Mehrere Bilder: Karussell mit Pfeilen links und rechts. Es läuft im
     Kreis – hinter dem letzten Bild kommt wieder das erste.            */
  const karussellHTML = (s) => {
    const bilder = (s.bilder || []).map(b => typeof b === "string" ? { bild:b } : b);
    if(bilder.length < 2) return null;
    const folien = bilder.map((b, n) =>
      '<div class="folie' + (n === 0 ? " ist-da" : "") + '" data-nr="' + n + '" ' +
      'data-unterschrift="' + sicher(b.unterschrift || "") + '"' +
      (n === 0 ? "" : ' aria-hidden="true"') + ">" +
      flaeche(b.bild, b.unterschrift || s.titel, n > 0) + "</div>").join("");
    const punkte = bilder.map((b, n) =>
      '<button type="button" class="karussell-punkt' + (n === 0 ? " ist-da" : "") +
      '" data-karussell-nr="' + n + '" aria-label="Bild ' + (n+1) + ' von ' + bilder.length + '"></button>').join("");
    return '<div class="karussell" data-karussell data-nr="0" tabindex="0" role="group" ' +
             'aria-roledescription="Bilderreihe" aria-label="' + sicher(s.titel) + '">' +
             '<div class="folien">' + folien + "</div>" +
             '<button type="button" class="karussell-pfeil karussell-pfeil--zurueck" ' +
               'data-karussell-schritt="-1" aria-label="Vorheriges Bild"></button>' +
             '<button type="button" class="karussell-pfeil karussell-pfeil--vor" ' +
               'data-karussell-schritt="1" aria-label="Nächstes Bild"></button>' +
             '<div class="karussell-punkte">' + punkte + "</div>" +
           "</div>";
  };

  const teile = DATEN.stationen.map((s, i) => {
    const bild = karussellHTML(s) || flaeche(s.bild, s.bildunterschrift || s.titel, false);

    if(s.typ === "jubilaeum"){
      return '<article class="station station--jubel" data-stein="' + sicher(s.stein || "diamant") + '">' +
        '<div class="jubel-karte">' +
          '<div class="jubel-stein"></div>' +
          '<span class="jubel-jahr">' + sicher(s.jahr) + "</span>" +
          '<h2 class="jubel-titel">' + sicher(s.titel) + "</h2>" +
          (s.ort ? '<p class="station-ort">' + sicher(s.ort) + "</p>" : "") +
          "<p>" + sicher(s.text) + "</p>" +
          /* Die Hochzeitstage sind Wortkarten. Nur wo ein "bild" eingetragen
             ist, erscheint ein Foto – bei den anderen bleibt das Feld leer. */
          (s.bild
            ? '<figure class="jubel-rahmen"><img class="jubel-bild" src="' + sicher(s.bild) +
              '" alt="' + sicher(s.titel) + '" loading="lazy" onerror="bildFehlt(this)">' +
              (s.bildunterschrift
                ? '<figcaption class="jubel-unterschrift">' + sicher(s.bildunterschrift) + "</figcaption>"
                : "") + "</figure>"
            : "") +
          (s.bausteine || []).map(bausteinHTML).join("") +
          sprungHTML(s) +
        "</div></article>";
    }
    return '<article class="station" style="' + streuung(i) + '">' +
      '<span class="jahr">' + sicher(s.jahr) + "</span>" +
      '<figure class="bild-rahmen" style="margin:0">' +
        '<span class="ecke lo"></span><span class="ecke ro"></span>' +
        '<span class="ecke lu"></span><span class="ecke ru"></span>' +
        bild +
        /* Beim Karussell zeigt die Unterschrift immer das Bild an, das
           gerade zu sehen ist – sie wird beim Blättern mitgetauscht. */
        '<figcaption class="bildunterschrift">' + sicher(
          (s.bilder && s.bilder.length > 1)
            ? ((typeof s.bilder[0] === "string" ? "" : s.bilder[0].unterschrift) || "")
            : (s.bildunterschrift || "")) + "</figcaption>" +
      "</figure>" +
      '<div class="station-text">' +
        '<h2 class="station-titel">' + sicher(s.titel) + "</h2>" +
        (s.ort ? '<p class="station-ort">' + sicher(s.ort) + "</p>" : "") +
        (s.text ? "<p>" + sicher(s.text) + "</p>" : "") +
        (s.bausteine || []).map(bausteinHTML).join("") +
        sprungHTML(s) +
      "</div></article>";
  });

  teile.push('<div id="faden-fuellung"></div>');
  teile.push('<div class="diamant-punkt station"><div class="stein"></div><p>… und es geht weiter.</p></div>');
  ziel.innerHTML = teile.join("");

  /* ---------- Bilderreihen (Karussell) ---------------------------------
     Blättert im Kreis: nach dem letzten Bild kommt wieder das erste.
     Bedienbar per Pfeilknopf, Punkt, Tastatur und Wischen.            */
  function karussellZeigen(kar, nr){
    const folien = [...kar.querySelectorAll(".folie")];
    if(!folien.length) return;
    const n = (nr % folien.length + folien.length) % folien.length;   // Kreis
    folien.forEach((f, k) => {
      f.classList.toggle("ist-da", k === n);
      if(k === n) f.removeAttribute("aria-hidden"); else f.setAttribute("aria-hidden", "true");
    });
    kar.querySelectorAll(".karussell-punkt").forEach((p, k) =>
      p.classList.toggle("ist-da", k === n));
    const unterschrift = kar.closest(".bild-rahmen")?.querySelector(".bildunterschrift");
    if(unterschrift) unterschrift.textContent = folien[n].dataset.unterschrift || "";
    kar.dataset.nr = n;
  }
  function karussellSchritt(kar, richtung){
    karussellZeigen(kar, (+kar.dataset.nr || 0) + richtung);
  }

  ziel.addEventListener("click", e => {
    const pfeil = e.target.closest("[data-karussell-schritt]");
    if(pfeil){
      e.preventDefault();
      karussellSchritt(pfeil.closest("[data-karussell]"), +pfeil.dataset.karussellSchritt);
      return;
    }
    const punkt = e.target.closest("[data-karussell-nr]");
    if(punkt){
      e.preventDefault();
      karussellZeigen(punkt.closest("[data-karussell]"), +punkt.dataset.karussellNr);
    }
  });

  ziel.addEventListener("keydown", e => {
    const kar = e.target.closest("[data-karussell]");
    if(!kar) return;
    if(e.key === "ArrowLeft"){ e.preventDefault(); karussellSchritt(kar, -1); }
    if(e.key === "ArrowRight"){ e.preventDefault(); karussellSchritt(kar, 1); }
  });

  /* Wischen auf dem Handy */
  let wischX = null, wischY = null, wischKar = null;
  ziel.addEventListener("pointerdown", e => {
    wischKar = e.target.closest("[data-karussell]");
    if(wischKar){ wischX = e.clientX; wischY = e.clientY; }
  });
  ziel.addEventListener("pointerup", e => {
    if(!wischKar || wischX === null) return;
    const dx = e.clientX - wischX, dy = e.clientY - wischY;
    if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5)
      karussellSchritt(wischKar, dx < 0 ? 1 : -1);
    wischKar = null; wischX = wischY = null;
  });

  // Ratefelder umschlagen lassen – nochmal antippen deckt sie wieder zu
  ziel.addEventListener("click", e => {
    const feld = e.target.closest("[data-raten]");
    if(feld) feld.classList.toggle("ist-auf");
  });

  // Antworten aufklappen
  ziel.addEventListener("click", e => {
    const k = e.target.closest("[data-frage]");
    if(!k) return;
    const antwort = k.parentElement.querySelector(".antwort");
    antwort.hidden = !antwort.hidden;
    k.textContent = antwort.hidden ? "Antwort zeigen" : "Antwort verbergen";
  });

  /* Einblenden beim Scrollen.
     Ausgelöst wird, sobald die Oberkante einer Station eine Linie kurz
     über dem unteren Bildrand überquert. Früher mussten 18 Prozent der
     Station zu sehen sein – davon war beim Laden aber zu wenig im Bild,
     und die erste Station blieb unsichtbar liegen, bis man scrollte.  */
  const beobachter = new IntersectionObserver((eintraege) => {
    eintraege.forEach(e => { if(e.isIntersecting){ e.target.classList.add("sichtbar"); beobachter.unobserve(e.target); }});
  }, { threshold:0, rootMargin:"0px 0px -12% 0px" });
  ziel.querySelectorAll(".station").forEach(el => beobachter.observe(el));
  fadenVerfolgen(ziel);
  routenStarten();
  europaStarten();
  galerienStarten();
  abstaendeStarten();
}

/* Der Faden wächst mit dem Scrollen mit. */
function fadenVerfolgen(strahl){
  const fuellung = document.getElementById("faden-fuellung");
  if(!fuellung) return;
  let laeuft = false;
  const rechnen = () => {
    const k = strahl.getBoundingClientRect();
    const gesamt = strahl.offsetHeight - 120;
    const anteil = Math.min(Math.max((window.innerHeight * .62 - k.top) / gesamt, 0), 1);
    fuellung.style.height = (anteil * gesamt) + "px";
    laeuft = false;
  };
  addEventListener("scroll", () => { if(!laeuft){ laeuft = true; requestAnimationFrame(rechnen); }}, {passive:true});
  addEventListener("resize", rechnen);
  rechnen();
}

/* ---------- Gästebuch ----------
   Speichert über window.storage (in Claude verfügbar, für alle sichtbar).
   Läuft die Seite später woanders, merkt sie sich Einträge nur bis zum
   Neuladen – dann braucht es einen Dienst wie Formspree oder Netlify Forms. */
const SCHLUESSEL = "gaestebuch:eintraege";
let eintraege = [];
let speicherAktiv = typeof window.storage !== "undefined";

async function eintraegeLaden(){
  if(!speicherAktiv) return;
  try{
    const ergebnis = await window.storage.get(SCHLUESSEL, true);
    if(ergebnis && ergebnis.value) eintraege = JSON.parse(ergebnis.value);
  }catch(e){ /* noch kein Eintrag vorhanden */ }
}
async function eintraegeSpeichern(){
  if(!speicherAktiv) return;
  try{ await window.storage.set(SCHLUESSEL, JSON.stringify(eintraege), true); }
  catch(e){ speicherAktiv = false; }
}
function eintraegeZeigen(){
  const liste = $("#gb-liste");
  if(!eintraege.length){
    liste.innerHTML = '<p class="gb-leer">Noch nichts eingetragen. Mach du den Anfang.</p>';
    return;
  }
  liste.innerHTML = eintraege.map(e =>
    '<div class="gb-eintrag"><div class="gb-von">' + sicher(e.name) +
    "<span>" + sicher(e.datum) + "</span></div>" +
    '<p class="gb-text">' + sicher(e.text) + "</p></div>"
  ).join("");
}
async function eintragen(){
  const name = $("#gb-name").value.trim();
  const text = $("#gb-text").value.trim();
  const status = $("#gb-status");
  if(!name || !text){
    status.textContent = "Name und Glückwunsch fehlen noch.";
    return;
  }
  const knopf = $("#gb-senden");
  knopf.disabled = true;
  eintraege.unshift({
    name, text,
    datum: new Date().toLocaleDateString("de-DE", { day:"2-digit", month:"long", year:"numeric" })
  });
  await eintraegeSpeichern();
  eintraegeZeigen();
  $("#gb-name").value = "";
  $("#gb-text").value = "";
  status.textContent = speicherAktiv
    ? "Eingetragen. Danke!"
    : "Eingetragen – auf dieser Seite aber nur bis zum Neuladen sichtbar.";
  knopf.disabled = false;
}
$("#gb-senden").addEventListener("click", eintragen);

/* Alle 15 Sekunden nachsehen, ob jemand anders etwas geschrieben hat.
   Läuft nur, wenn der Nutzer gerade nicht selbst tippt.                    */
function nachladenStarten(){
  if(!speicherAktiv) return;
  setInterval(async () => {
    if(document.hidden) return;
    if(document.activeElement && document.activeElement.classList.contains("gb-feld")) return;
    const vorher = eintraege.length;
    await eintraegeLaden();
    if(eintraege.length !== vorher) eintraegeZeigen();
  }, 15000);
}


/* ============================================================================
   ANSICHTEN: Album, Stammbaum, Orte
   ============================================================================ */
let karteGebaut = false, baumGebaut = false;
let baumPunkte = {}, baumSteuerung = null, karteObjekt = null, karteNadeln = [];

let rueckkehrZu = null;   // merkt sich, von welcher Station aus gesprungen wurde

function ansichtZeigen(name){
  $("#ansicht-album").hidden     = name !== "album";
  $("#ansicht-stammbaum").hidden = name !== "stammbaum";
  $("#ansicht-orte").hidden      = name !== "orte";
  /* Der Zurück-Knopf ist immer da – egal, ob man über einen Sprung aus
     einer Station kam oder über die Knöpfe unter der Zeitleiste.        */
  document.querySelectorAll("[data-zurueck]").forEach(k => k.hidden = false);
  if(name === "stammbaum" && !baumGebaut){ baumBauen(); baumGebaut = true; }
  /* Die Fußzeile gehört zum Album. Unter dem Stammbaum oder der Karte
     hätte sie nichts zu suchen – und sie würde dort dafür sorgen, dass
     die Seite doch wieder gescrollt werden muss.                      */
  const fuss = $("#fuss");
  if(fuss) fuss.hidden = name !== "album";
  if(name === "orte" && !karteGebaut){ karteBauen(); karteGebaut = true; }
  if(name !== "album") window.scrollTo(0, 0);
}

/* Zurück zur Zeitleiste – genau dorthin, wo man weggegangen ist.
   Kam man über einen Sprung aus einer Station, führt der Weg zu dieser
   Station zurück. Kam man über die Knöpfe unter der Zeitleiste, geht es
   an genau die Stelle zurück, an der man gestanden hat.                */
let albumPosition = 0;
function zurueckZurZeitleiste(){
  const nr = rueckkehrZu;
  rueckkehrZu = null;
  ansichtZeigen("album");
  if(nr === null || nr === undefined){
    requestAnimationFrame(() => window.scrollTo(0, albumPosition));
    return;
  }
  const station = document.querySelectorAll("#zeitstrahl .station")[nr];
  if(station) requestAnimationFrame(() =>
    station.scrollIntoView({ behavior:"smooth", block:"center" }));
}
document.querySelectorAll("[data-zurueck]").forEach(k =>
  k.addEventListener("click", zurueckZurZeitleiste));

/* Die beiden ruhigen Einstiege unter der Zeitleiste */
document.querySelectorAll("[data-oeffne]").forEach(k =>
  k.addEventListener("click", () => {
    albumPosition = window.scrollY;
    rueckkehrZu = null;
    ansichtZeigen(k.dataset.oeffne);
  }));

/* Sprung aus einer Station heraus */
function stationsNummer(el){
  const alle = [...document.querySelectorAll("#zeitstrahl .station")];
  return alle.indexOf(el.closest(".station"));
}
document.addEventListener("click", e => {
  const k = e.target.closest("[data-sprung]");

  rueckkehrZu = stationsNummer(k);
  if(k.dataset.sprung === "person"){

    ortZeigen(k.dataset.ziel);
  }
});

/* ---------- Zoomen und Schieben (für den Stammbaum) ---------------------- */
function buehneSteuern(buehne, inhalt){
  let z = 1, x = 0, y = 0, zieht = false, letzteX = 0, letzteY = 0, startAbstand = 0, startZ = 1;
  const setzen = () => inhalt.style.transform = `translate(${x}px,${y}px) scale(${z})`;
  const grenzen = () => { z = Math.min(Math.max(z, .35), 3); };

  const zoomAuf = (faktor, mx, my) => {
    const alt = z; z *= faktor; grenzen();
    x = mx - (mx - x) * (z / alt);
    y = my - (my - y) * (z / alt);
    setzen();
  };

  buehne.addEventListener("wheel", e => {
    e.preventDefault();
    const k = buehne.getBoundingClientRect();
    zoomAuf(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - k.left, e.clientY - k.top);
  }, {passive:false});

  /* Wichtig: Der Zeiger wird erst eingefangen, wenn wirklich gezogen wird.
     Sonst schluckt die Bühne jeden Klick und man kann keine Person mehr
     antippen.                                                            */
  let startX = 0, startY = 0, wurdeGezogen = false;
  buehne.addEventListener("pointerdown", e => {
    if(e.target.closest(".zoom-knoepfe")) return;
    zieht = true; wurdeGezogen = false;
    startX = letzteX = e.clientX; startY = letzteY = e.clientY;
  });
  buehne.addEventListener("pointermove", e => {
    if(!zieht) return;
    if(!wurdeGezogen){
      if(Math.hypot(e.clientX - startX, e.clientY - startY) < 5) return;
      wurdeGezogen = true;
      try{ buehne.setPointerCapture(e.pointerId); }catch(x){}
    }
    x += e.clientX - letzteX; y += e.clientY - letzteY;
    letzteX = e.clientX; letzteY = e.clientY; setzen();
  });
  /* Nach einem Zug den unmittelbar folgenden Klick verschlucken, damit man
     beim Verschieben nicht versehentlich jemanden auswählt. Die Marke hält
     nur bis zum Ende dieses einen Zugs – sonst bliebe sie hängen, wenn der
     Browser nach dem Ziehen gar keinen Klick schickt, und würde dann den
     nächsten echten Antipper schlucken.                                   */
  let zugEben = false;
  buehne.addEventListener("pointerup", () => {
    if(wurdeGezogen){
      zugEben = true;
      setTimeout(() => { zugEben = false; }, 0);   // läuft direkt nach dem Klick
    }
    zieht = false; wurdeGezogen = false;
  });
  ["pointercancel","pointerleave"].forEach(t =>
    buehne.addEventListener(t, () => { zieht = false; wurdeGezogen = false; }));
  buehne.addEventListener("click", e => {
    if(zugEben) e.stopPropagation();
  }, true);

  /* zwei Finger */
  const abstand = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  buehne.addEventListener("touchstart", e => {
    if(e.touches.length === 2){ zieht = false; startAbstand = abstand(e.touches); startZ = z; }
  }, {passive:true});
  buehne.addEventListener("touchmove", e => {
    if(e.touches.length === 2 && startAbstand){
      e.preventDefault();
      const k = buehne.getBoundingClientRect();
      const mx = (e.touches[0].clientX + e.touches[1].clientX)/2 - k.left;
      const my = (e.touches[0].clientY + e.touches[1].clientY)/2 - k.top;
      const alt = z; z = startZ * (abstand(e.touches) / startAbstand); grenzen();
      x = mx - (mx - x) * (z / alt); y = my - (my - y) * (z / alt); setzen();
    }
  }, {passive:false});
  buehne.addEventListener("touchend", () => { startAbstand = 0; }, {passive:true});

  buehne.querySelectorAll("[data-zoom]").forEach(b => b.addEventListener("click", () => {
    const k = buehne.getBoundingClientRect();
    if(b.dataset.zoom === "reset"){ return einpassen(); }
    zoomAuf(b.dataset.zoom === "rein" ? 1.25 : .8, k.width/2, k.height/2);
  }));

  function einpassen(){
    const b = inhalt.firstElementChild;
    if(!b) return;
    const bb = buehne.getBoundingClientRect();
    const bw = parseFloat(b.getAttribute("width")), bh = parseFloat(b.getAttribute("height"));
    z = Math.min((bb.width - 30) / bw, (bb.height - 30) / bh, 1.4);
    x = (bb.width - bw * z) / 2; y = (bb.height - bh * z) / 2;
    setzen();
  }
  function zentrieren(px, py, zoom){
    const bb = buehne.getBoundingClientRect();
    z = zoom || 1.05; grenzen();
    x = bb.width / 2 - px * z;
    y = bb.height / 2.4 - py * z;
    setzen();
  }
  return { einpassen, zentrieren };
}

/* ---------- Stammbaum ---------------------------------------------------- */
function baumBauen(){
  const F = DATEN.familie;
  const KB = 186, KH = 56, LUECKE = 22, EBENE = 132;
  const FOTO = 17;            // Radius der Miniatur im Kasten
  /* Das Foto sitzt links im Kasten, der Text rückt daneben. */
  const TEXT_MITTE = 8 + FOTO * 2 + 8 + (KB - 8 - FOTO * 2 - 8 - 10) / 2;

  /* Kleines rundes Foto am linken Rand eines Kastens. Darunter liegt ein
     grauer Kreis – fehlt die Bilddatei noch, bleibt einfach der Kreis
     stehen, ganz ohne kaputtes Bildsymbol.                             */
  function fotoKreis(quelle, id, links, oben){
    const cx = links + 8 + FOTO, cy = oben + KH / 2;
    const schnitt = "rund-" + String(id).replace(/[^\w-]/g, "");
    return `<g class="baum-foto">
      <circle class="baum-foto-grund" cx="${cx}" cy="${cy}" r="${FOTO}"/>
      ${quelle ? `<clipPath id="${schnitt}"><circle cx="${cx}" cy="${cy}" r="${FOTO}"/></clipPath>
      <image href="${sicher(quelle)}" x="${cx - FOTO}" y="${cy - FOTO}"
             width="${FOTO * 2}" height="${FOTO * 2}"
             preserveAspectRatio="xMidYMid slice" clip-path="url(#${schnitt})"
             onerror="this.remove()"/>` : ""}
      <circle class="baum-foto-ring" cx="${cx}" cy="${cy}" r="${FOTO}"/>
    </g>`;
  }


  /* Wurzel ist das Paar; darunter die Kinder */
  const wurzel = { paar:F.paar, kinder:F.kinder || [] };
  let naechstesX = 0;

  /* Lange Namen auf zwei Zeilen brechen, an der ausgewogensten Wortgrenze.
     Ein Wort, das allein zu lang ist, bleibt stehen und wird kleiner gesetzt. */
  function namenSatz(name, x, y, klasse){
    const grenze = 16;                       // Zeichen, die neben dem Foto in den Kasten passen
    if(name.length <= grenze)
      return `<text class="${klasse}" x="${x}" y="${y}">${sicher(name)}</text>`;

    const worte = name.split(" ");
    if(worte.length === 1)                   // nichts zu brechen
      return `<text class="${klasse}" x="${x}" y="${y}" style="font-size:12px">${sicher(name)}</text>`;

    let bester = 1, abstand = Infinity;
    for(let i = 1; i < worte.length; i++){
      const oben = worte.slice(0, i).join(" ").length;
      const unten = worte.slice(i).join(" ").length;
      const d = Math.abs(oben - unten) + Math.max(0, Math.max(oben, unten) - grenze) * 3;
      if(d < abstand){ abstand = d; bester = i; }
    }
    const oben = worte.slice(0, bester).join(" ");
    const unten = worte.slice(bester).join(" ");
    const klein = Math.max(oben.length, unten.length) > grenze ? ' style="font-size:13px"' : "";
    return `<text class="${klasse}" x="${x}" y="${y - 8}"${klein}>${sicher(oben)}</text>` +
           `<text class="${klasse}" x="${x}" y="${y + 9}"${klein}>${sicher(unten)}</text>`;
  }

  /* Wie breit ein Knoten baut: allein, als Paar, oder mit angeheiratetem Partner. */
  const knotenBreite = (k) => k.paar ? KB * 2 + 16 : (k.partner ? KB * 2 + 12 : KB);

  /* Einen Knoten samt allem darunter nach rechts schieben. */
  function verschieben(k, d){
    k._x += d;
    (k.kinder || []).forEach(c => verschieben(c, d));
  }

  function auslegen(k, tiefe){
    k._y = tiefe * EBENE;
    const breite = knotenBreite(k);
    if(!k.kinder || !k.kinder.length){
      k._x = naechstesX + breite / 2;
      naechstesX += breite + LUECKE;
      return;
    }
    const startX = naechstesX;
    k.kinder.forEach(c => auslegen(c, tiefe + 1));
    const erst = k.kinder[0]._x, letzt = k.kinder[k.kinder.length - 1]._x;
    k._x = (erst + letzt) / 2;

    /* Ist der Knoten breiter als der Bereich seiner Kinder, würde er nach links
       in den Nachbarn ragen – dann rückt der ganze Ast nach rechts. */
    const ueberstand = startX - (k._x - breite / 2);
    if(ueberstand > 0) verschieben(k, ueberstand);

    naechstesX = Math.max(naechstesX, k._x + breite / 2 + LUECKE);
  }
  auslegen(wurzel, 0);

  /* Bei Bedarf nach rechts schieben, damit nichts negativ wird */
  let minX = Infinity, maxX = -Infinity, maxY = 0;
  (function messen(k){
    const halb = knotenBreite(k) / 2;
    minX = Math.min(minX, k._x - halb); maxX = Math.max(maxX, k._x + halb);
    maxY = Math.max(maxY, k._y);
    (k.kinder || []).forEach(messen);
  })(wurzel);
  const rand = 30, verschub = rand - minX;
  const breiteGesamt = (maxX - minX) + rand * 2;
  const hoeheGesamt = maxY + KH + rand * 2;

  const teile = [];
  (function zeichnen(k, elternRolle){
    const x = k._x + verschub, y = k._y + rand;

    /* Linien zu den Kindern */
    (k.kinder || []).forEach(c => {
      const cx = c._x + verschub, cy = c._y + rand;
      const mitte = y + KH + (EBENE - KH) / 2;
      teile.push(`<path class="baum-linie" d="M ${x} ${y + KH} V ${mitte} H ${cx} V ${cy}"/>`);
    });

    if(k.paar){
      const links = x - KB - 8, rechts = x + 8;
      k.paar.forEach((person, i) => {
        const px = i === 0 ? links : rechts;
        teile.push(`<g class="baum-person" data-id="${sicher(person.id||"")}" data-name="${sicher(person.name)}" data-jahr="${sicher(person.jahr||"")}" data-rolle="${i===0?"Oma":"Opa"}" data-bild="${sicher(person.bild||"")}">
          <rect class="baum-kasten baum-kasten--paar" x="${px}" y="${y}" width="${KB}" height="${KH}" rx="14"/>
          ${fotoKreis(person.bild, person.id, px, y)}
          ${namenSatz(person.name, px + TEXT_MITTE, y + 22, "baum-name baum-name--hell")}
          <text class="baum-jahr baum-jahr--hell" x="${px + TEXT_MITTE}" y="${y + 42}">${sicher(person.jahr||"")}</text>
        </g>`);
      });
      teile.push(`<path class="baum-herz" d="M ${x} ${y + KH/2 + 5} l -6 -7 a 4 4 0 0 1 6 -5 a 4 4 0 0 1 6 5 z"/>`);
    }else{
      /* Mit Partner sitzen zwei Kästen nebeneinander, ohne Partner einer mittig. */
      const hatPartner = !!k.partner;
      const px = hatPartner ? x - KB - 6 : x - KB/2;

      teile.push(`<g class="baum-person" data-id="${sicher(k.id||"")}" data-name="${sicher(k.name)}" data-jahr="${sicher(k.jahr||"")}" data-rolle="${sicher(k.rolle || elternRolle)}" data-bild="${sicher(k.bild||"")}" data-partner="${sicher(k.partner||"")}">
        <rect class="baum-kasten" x="${px}" y="${y}" width="${KB}" height="${KH}" rx="14"/>
        ${fotoKreis(k.bild, k.id, px, y)}
        ${namenSatz(k.name, px + TEXT_MITTE, y + 22, "baum-name")}
        <text class="baum-jahr" x="${px + TEXT_MITTE}" y="${y + 42}">${sicher(k.jahr||"")}</text>
      </g>`);

      if(hatPartner){
        const rx = x + 6;
        teile.push(`<path class="baum-band" d="M ${x - 6} ${y + KH/2} H ${x + 6}"/>`);
        teile.push(`<g class="baum-person baum-person--partner" data-id="${sicher((k.id||"") + "-partner")}" data-name="${sicher(k.partner)}" data-jahr="" data-rolle="Angeheiratet" data-bild="${sicher(k.partnerBild||"")}" data-partner="">
          <rect class="baum-kasten baum-kasten--partner" x="${rx}" y="${y}" width="${KB}" height="${KH}" rx="14"/>
          ${fotoKreis(k.partnerBild, (k.id||"") + "-partner", rx, y)}
          ${namenSatz(k.partner, rx + TEXT_MITTE, y + 30, "baum-name baum-name--partner")}
        </g>`);
      }
    }
    const rollen = { "Das Paar":"Tochter", "Tochter":"Enkelkind", "Enkelkind":"Urenkel" };
    (k.kinder || []).forEach(c => zeichnen(c, rollen[elternRolle] || "Tochter"));
  })(wurzel, "Das Paar");

  $("#baum-inhalt").innerHTML =
    `<svg width="${breiteGesamt}" height="${hoeheGesamt}" viewBox="0 0 ${breiteGesamt} ${hoeheGesamt}" xmlns="http://www.w3.org/2000/svg">${teile.join("")}</svg>`;

  /* Positionen merken, damit man einzelne Personen anspringen kann */
  baumPunkte = {};
  (function sammeln(k){
    if(k.paar){ k.paar.forEach(pp => baumPunkte[pp.id] = { x:k._x + verschub, y:k._y + rand }); }
    else if(k.id){ baumPunkte[k.id] = { x:k._x + verschub, y:k._y + rand }; }
    (k.kinder || []).forEach(sammeln);
  })(wurzel);

  baumSteuerung = buehneSteuern($("#baum-buehne"), $("#baum-inhalt"));
  const steuerung = baumSteuerung;
  steuerung.einpassen();
  addEventListener("resize", () => { if(!$("#ansicht-stammbaum").hidden) steuerung.einpassen(); });

  $("#baum-inhalt").addEventListener("click", e => {
    const g = e.target.closest(".baum-person");
    if(!g) return;
    document.querySelectorAll(".baum-person").forEach(p => p.classList.remove("ist-gewaehlt"));
    g.classList.add("ist-gewaehlt");
    const karte = $("#person-karte");
    /* Am Rechner nimmt die Karte der Bühne Platz weg. Ändert sich deren
       Höhe dadurch, muss der Baum neu eingepasst werden – sonst wird die
       unterste Reihe angeschnitten.                                     */
    const hoeheVorher = $("#baum-buehne").clientHeight;
    karte.hidden = false;
    /* In der Karte steht dasselbe Foto wie oben im Stammbaum, nur groß
       und weiterhin rund. Fehlt die Datei, bleibt der leere Kreis.     */
    const quelle = g.dataset.bild || "";
    karte.innerHTML =
      '<figure class="person-rund">' +
        (quelle ? '<img src="' + quelle + '" alt="' + g.dataset.name + '" loading="lazy">' : "") +
      "</figure>" +
      '<div class="person-wer">' +
        "<h3>" + g.dataset.name + "</h3>" +
        '<p class="rolle">' + g.dataset.rolle +
        (g.dataset.jahr ? " · " + g.dataset.jahr : "") + "</p>" +
      "</div>";
    if($("#baum-buehne").clientHeight !== hoeheVorher)
      requestAnimationFrame(() => steuerung.einpassen());
  });

  /* Jede Person auch mit der Tastatur erreichbar machen: mit Tab
     anspringen, mit Enter oder Leertaste öffnen.                          */
  document.querySelectorAll(".baum-person").forEach(g => {
    g.setAttribute("tabindex", "0");
    g.setAttribute("role", "button");
    g.setAttribute("aria-label",
      g.dataset.name + (g.dataset.jahr ? ", " + g.dataset.jahr : "") +
      (g.dataset.rolle ? " – " + g.dataset.rolle : ""));
  });
  $("#baum-inhalt").addEventListener("keydown", e => {
    if(e.key !== "Enter" && e.key !== " ") return;
    const g = e.target.closest(".baum-person");
    if(!g) return;
    e.preventDefault();
    g.dispatchEvent(new Event("click", { bubbles:true }));
  });
}

/* Eine bestimmte Person im Baum ansteuern und hervorheben. */
function personZeigen(id){
  const tun = () => {
    const g = document.querySelector('.baum-person[data-id="' + id + '"]');
    /* Ganzen Baum zeigen, nicht auf die Person zoomen – sonst liegen die
       übrigen außerhalb der Bühne und lassen sich nicht mehr antippen.   */
    if(baumSteuerung) baumSteuerung.einpassen();
    document.querySelectorAll(".baum-person").forEach(x => x.classList.remove("ist-ziel","ist-gewaehlt"));
    if(g){ g.classList.add("ist-ziel"); g.dispatchEvent(new Event("click", { bubbles:true })); }
  };
  requestAnimationFrame(() => requestAnimationFrame(tun));
}

/* Einen bestimmten Ort auf der Karte ansteuern. */
function ortZeigen(id){
  const o = (DATEN.orte || []).find(x => x.id === id);
  if(!o) return;
  const tun = () => {
    if(!karteObjekt || !o.lat) return setTimeout(tun, 300);   // Adresse wird noch gesucht
    karteObjekt.invalidateSize();
    karteObjekt.setView([o.lat, o.lng], 15, { animate:false });
    const nadel = karteNadeln.find(n => {
      const s = n.getLatLng(); return Math.abs(s.lat - o.lat) < 1e-6;
    });
    if(nadel) nadel.openPopup();
  };
  setTimeout(tun, 120);
}

/* ---------- Karte -------------------------------------------------------- */
/* Sucht zu einer Adresse die Koordinaten (OpenStreetMap-Suchdienst).
   Ergebnisse werden im Browser gemerkt, damit nicht bei jedem Besuch
   neu gesucht wird. Schlägt es fehl, bleibt der Ort einfach ohne Nadel. */
async function adresseAufloesen(adresse){
  const schluessel = "geo:" + adresse;
  try{
    const gemerkt = localStorage.getItem(schluessel);
    if(gemerkt){ const p = JSON.parse(gemerkt); p.gemerkt = true; return p; }
  }catch(e){ /* Speicher nicht verfügbar – dann eben jedes Mal neu */ }

  try{
    const antwort = await fetch(
      "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
      encodeURIComponent(adresse), { headers:{ "Accept":"application/json" } });
    const treffer = await antwort.json();
    if(!treffer.length) return null;
    const punkt = { lat:parseFloat(treffer[0].lat), lng:parseFloat(treffer[0].lon) };
    try{ localStorage.setItem(schluessel, JSON.stringify(punkt)); }catch(e){}
    return punkt;
  }catch(e){ return null; }
}

async function orteVorbereiten(orte){
  for(const o of orte){
    if(o.lat && o.lng) continue;
    if(o.art === "fern") continue;
    if(!o.adresse || o.adresse === "Platzhalter") continue;
    const punkt = await adresseAufloesen(o.adresse);
    if(punkt){ o.lat = punkt.lat; o.lng = punkt.lng; }
    await new Promise(r => setTimeout(r, 1100));   // der Dienst bittet um eine Anfrage pro Sekunde
  }
  return orte.filter(o => o.lat && o.lng && o.art !== "fern");
}

let leafletVersprechen = null;
function leafletLaden(){
  if(leafletVersprechen) return leafletVersprechen;
  leafletVersprechen = new Promise((fertig, schiefgelaufen) => {
    const css = document.createElement("link");
    css.rel = "stylesheet";

}


/* ---------- Luftlinie zwischen zwei Orten ------------------------------
   Rechnet die Entfernung aus den beiden Adressen aus, sobald sie
   aufgelöst sind. Ohne Internet bleibt der Baustein still.              */
const abstaende = [];
function abstandHTML(b){
  const nr = abstaende.length;
  abstaende.push(b);
  return '<div class="baustein abstand" id="abstand-' + nr + '" hidden>' +
         '<span class="abstand-zahl"></span>' +
         '<span class="abstand-text">' + sicher(b.text || "Luftlinie") + "</span></div>";
}

function abstaendeStarten(){
  abstaende.forEach(async (b, nr) => {
    const el = document.getElementById("abstand-" + nr);
    if(!el) return;
    const orte = DATEN.orte || [];
    const hole = async (id) => {
      const o = orte.find(x => x.id === id);
      if(!o) return null;
      if(o.lat && o.lng) return o;
      if(!o.adresse || o.adresse === "Platzhalter") return null;
      const punkt = await adresseAufloesen(o.adresse);
      if(punkt){ o.lat = punkt.lat; o.lng = punkt.lng; }
      return o.lat ? o : null;
    };
    const a = await hole(b.von);
    await new Promise(r => setTimeout(r, 1100));
    const c = await hole(b.nach);
    if(!a || !c) return;

    /* Haversine */
    const R = 6371000, g = Math.PI / 180;
    const dp = (c.lat - a.lat) * g, dl = (c.lng - a.lng) * g;
    const x = Math.sin(dp/2)**2 + Math.cos(a.lat*g) * Math.cos(c.lat*g) * Math.sin(dl/2)**2;
    const m = 2 * R * Math.asin(Math.sqrt(x));

    el.querySelector(".abstand-zahl").textContent =
      m < 950 ? Math.round(m / 10) * 10 + " Meter"
              : (m / 1000).toFixed(1).replace(".", ",") + " Kilometer";
    el.hidden = false;
  });
}

/* ---------- Fotogalerie innerhalb einer Station ------------------------- */
const galerien = [];
function galerieHTML(b){
  const nr = galerien.length;
  const bilder = (b.bilder || []).filter(x => x.quelle);
  galerien.push(bilder);
  if(!bilder.length) return "";
  return '<div class="baustein notiz"><b>' + sicher(b.titel || "Weitere Bilder") + "</b>" +

    '<div class="galerie" data-galerie="' + nr + '">' +
    bilder.map((x, i) =>
      '<button type="button" class="galerie-feld" data-nr="' + i + '" ' +
      'aria-label="Bild ' + (i+1) + ' von ' + bilder.length + ' groß ansehen">' +
      '<img src="' + sicher(x.quelle) + '" alt="' + sicher(x.text || "") +
      '" loading="lazy" onerror="this.closest(\'.galerie-feld\').classList.add(\'fehlt\')">' +
      "</button>").join("") +
    "</div></div>";
}

/* Großansicht: ein Fenster für alle Galerien */
let lupeNr = 0, lupeBild = 0;
function lupeAufbauen(){
  if(document.getElementById("lupe")) return;
  const d = document.createElement("div");
  d.id = "lupe";
  d.hidden = true;
  d.innerHTML =
    '<button type="button" class="lupe-zu" aria-label="Schließen">✕</button>' +
    '<button type="button" class="lupe-pfeil lupe-links" aria-label="Vorheriges Bild">‹</button>' +
    '<figure class="lupe-inhalt"><img alt=""><figcaption></figcaption></figure>' +
    '<button type="button" class="lupe-pfeil lupe-rechts" aria-label="Nächstes Bild">›</button>';
  document.body.appendChild(d);

  const zeigen = () => {
    const bilder = galerien[lupeNr] || [];
    const b = bilder[lupeBild];
    if(!b) return;
    d.querySelector("img").src = b.quelle;
    d.querySelector("figcaption").textContent =
      (b.text && b.text !== "Platzhalter" ? b.text + " · " : "") +
      (lupeBild + 1) + " von " + bilder.length;
    d.querySelector(".lupe-links").hidden  = bilder.length < 2;
    d.querySelector(".lupe-rechts").hidden = bilder.length < 2;
  };
  const blaettern = (d2) => {
    const n = (galerien[lupeNr] || []).length;
    lupeBild = (lupeBild + d2 + n) % n;
    zeigen();
  };
  const schliessen = () => { d.hidden = true; document.body.style.overflow = ""; };

  d.querySelector(".lupe-zu").addEventListener("click", schliessen);
  d.querySelector(".lupe-links").addEventListener("click", () => blaettern(-1));
  d.querySelector(".lupe-rechts").addEventListener("click", () => blaettern(1));
  d.addEventListener("click", e => { if(e.target === d) schliessen(); });
  addEventListener("keydown", e => {
    if(d.hidden) return;
    if(e.key === "Escape") schliessen();
    if(e.key === "ArrowLeft") blaettern(-1);
    if(e.key === "ArrowRight") blaettern(1);
  });
  d._zeigen = zeigen;
}

function galerienStarten(){
  if(!galerien.length) return;
  lupeAufbauen();
  document.addEventListener("click", e => {
    const feld = e.target.closest(".galerie-feld");
    if(!feld || feld.classList.contains("fehlt")) return;
    lupeNr = +feld.closest(".galerie").dataset.galerie;
    lupeBild = +feld.dataset.nr;
    const d = document.getElementById("lupe");
    d.hidden = false;
    document.body.style.overflow = "hidden";
    d._zeigen();
  });
}

/* ---------- Europakarte innerhalb einer Station ------------------------- */
const europakarten = [];
function europaHTML(b){
  const nr = europakarten.length;
  europakarten.push(b);
  return '<div class="baustein notiz"><b>' + sicher(b.titel || "Wo sie waren") + "</b>" +
         (b.text ? '<p style="margin:0 0 14px">' + sicher(b.text) + "</p>" : "") +
         '<div class="europa-karte" id="europa-' + nr + '"></div>' +
         /* Die Länderliste unter der Karte ist bewusst weg – die Karte spricht
            für sich. Zum Wiedereinschalten diese Zeile einkommentieren:
            '<ul class="laender-liste" id="laender-' + nr + '"></ul>' +          */
         "</div>";
}

function europaStarten(){
  if(!europakarten.length) return;
  const beobachter = new IntersectionObserver((eintraege, selbst) => {
    for(const e of eintraege){
      if(!e.isIntersecting) continue;
      selbst.unobserve(e.target);
      const nr = +e.target.id.split("-")[1];
      europaZeichnen(nr, europakarten[nr]);
    }
  }, { rootMargin:"250px" });
  europakarten.forEach((_, nr) => {
    const el = document.getElementById("europa-" + nr);
    if(el) beobachter.observe(el);
  });
}

function europaZeichnen(nr, b){
  const ziel  = document.getElementById("europa-" + nr);
  const liste = document.getElementById("laender-" + nr);
  const laender = (b.laender || []).filter(l => l.code);
  const besucht = new Set(laender.map(l => l.code.toUpperCase()));

  /* Liste unter der Karte – nur füllen, wenn sie überhaupt da ist */
  if(liste) liste.innerHTML = laender.map(l =>
    '<li data-code="' + sicher(l.code.toUpperCase()) + '"><b>' + sicher(l.name || l.code) + "</b>" +
    (l.jahr && l.jahr !== "Platzhalter" ? '<span class="wann">' + sicher(l.jahr) + "</span>" : "") +
    (l.text ? '<span class="was">' + sicher(l.text) + "</span>" : "") + "</li>").join("");

  /* Karte: erst die nicht besuchten, dann die besuchten darüber */
  const formen = Object.keys(EUROPA_UMRISSE).sort((x, y) =>
    (besucht.has(x) ? 1 : 0) - (besucht.has(y) ? 1 : 0)).map(code => {
      const war = besucht.has(code);
      const eintrag = war ? laender.find(l => l.code.toUpperCase() === code) : null;
      return '<path class="land' + (war ? " land--besucht" : "") + '" d="' +
        EUROPA_UMRISSE[code] + '" data-code="' + code + '"' +
        (war ? ' tabindex="0" role="button"><title>' + sicher(eintrag.name || code) +
               (eintrag.jahr && eintrag.jahr !== "Platzhalter" ? " · " + sicher(eintrag.jahr) : "") +
               "</title></path>"
             : "></path>");
    }).join("");

  /* Besondere Ziele als Stern. Koordinaten in Grad, die Umrechnung
     entspricht dem Kartenausschnitt (West -25, Ost 32, Süd 34, Nord 71,5). */
  const nachXY = (lng, lat) => [
    (lng + 25) / 57 * 700,
    748 - (lat - 34) / 37.5 * 748
  ];
  const sternPfad = (x, y, r) => {
    let d = "";
    for(let i = 0; i < 10; i++){
      const w = Math.PI / 5 * i - Math.PI / 2;
      const rr = i % 2 ? r * .42 : r;
      d += (i ? "L" : "M") + (x + Math.cos(w) * rr).toFixed(1) + " " + (y + Math.sin(w) * rr).toFixed(1);
    }
    return d + "Z";
  };
  const sterne = (b.sterne || []).map(o => {
    const [x, y] = nachXY(o.lng, o.lat);
    return '<g class="stern"><path d="' + sternPfad(x, y, 7.5) + '"></path>' +
           "<title>" + sicher(o.name) + "</title></g>";
  }).join("");

  /* Der Ausgangspunkt: Ring mit Kern, damit er sich klar von den Sternen
     unterscheidet. Steht wie die Sterne nicht in der Liste darunter.     */
  const heimat = (b.heimat || []).map(o => {
    const [x, y] = nachXY(o.lng, o.lat);
    return '<g class="heimat">' +
           '<circle class="heimat-ring" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="7"></circle>' +
           '<circle class="heimat-kern" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2.6"></circle>' +
           "<title>" + sicher(o.name) + "</title></g>";
  }).join("");

  ziel.innerHTML = '<svg viewBox="0 0 700 748" xmlns="http://www.w3.org/2000/svg" ' +
    'preserveAspectRatio="xMidYMid meet" role="img" aria-label="Karte von Europa, ' +
    besucht.size + ' Länder hervorgehoben">' + formen + sterne + heimat + "</svg>";

  /* Karte und Liste zeigen aufeinander */
  const hervorheben = (code) => {
    ziel.querySelectorAll(".land--besucht").forEach(l =>
      l.classList.toggle("ist-gewaehlt", l.dataset.code === code));
    if(liste) liste.querySelectorAll("li").forEach(l =>
      l.classList.toggle("ist-gewaehlt", l.dataset.code === code));
  };
  ziel.addEventListener("click", e => {
    const l = e.target.closest(".land--besucht");
    if(l) hervorheben(l.dataset.code);
  });
  ziel.addEventListener("keydown", e => {
    if(e.key !== "Enter" && e.key !== " ") return;
    const l = e.target.closest(".land--besucht");
    if(l){ e.preventDefault(); hervorheben(l.dataset.code); }
  });
  if(liste) liste.addEventListener("click", e => {
    const l = e.target.closest("li");
    if(l) hervorheben(l.dataset.code);
  });
}

/* ---------- Kleine Routenkarte innerhalb einer Station ------------------ */
const routen = [];
function routeHTML(b){
  const nr = routen.length;
  routen.push(b);
  const bild = b.bild
    ? '<figure class="route-bild"><img src="' + sicher(b.bild) + '" alt="' +
      sicher(b.bildunterschrift || b.titel || "") + '" loading="lazy" ' +
      'onerror="this.closest(\'.route-bild\').classList.add(\'fehlt\')">' +
      (b.bildunterschrift ? "<figcaption>" + sicher(b.bildunterschrift) + "</figcaption>" : "") +
      "</figure>"
    : '<figure class="route-bild fehlt"><figcaption>' +
      sicher(b.bildunterschrift || "Hier kommt ein Foto hin") + "</figcaption></figure>";
  return '<div class="baustein notiz"><b>' + sicher(b.titel || "Die Route") + "</b>" +
         (b.text ? '<p style="margin:0 0 12px">' + sicher(b.text) + "</p>" : "") +
         bild +
         '<div class="route-karte" id="route-' + nr + '"></div></div>';
}

function routenStarten(){
  if(!routen.length) return;
  const beobachter = new IntersectionObserver(async (eintraege, selbst) => {
    for(const e of eintraege){
      if(!e.isIntersecting) continue;
      selbst.unobserve(e.target);
      const nr = +e.target.id.split("-")[1];
      const b = routen[nr];
      try{ await leafletLaden(); }catch(x){
        e.target.innerHTML = '<div class="karten-fehler">Karte nicht verfügbar.</div>';
        continue;
      }
      const punkte = (b.punkte || []).filter(pp => pp.lat && pp.lng);
      if(punkte.length < 2){
        e.target.innerHTML = '<div class="karten-fehler">Noch keine Route hinterlegt.</div>';
        continue;
      }
      const k = L.map(e.target.id, { scrollWheelZoom:false, zoomControl:true });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        { maxZoom:16, attribution:"© OpenStreetMap" }).addTo(k);
      const linie = punkte.map(pp => [pp.lat, pp.lng]);
      L.polyline(linie, { color:"#4a6338", weight:4, opacity:.9, lineJoin:"round" }).addTo(k);
      punkte.forEach((pp, i) => {
        const rand = (i === 0 || i === punkte.length - 1);
        const gr = rand ? 15 : 9;
        L.marker([pp.lat, pp.lng], { icon: L.divIcon({
          className:"", iconSize:[gr,gr], iconAnchor:[gr/2,gr/2],
          html:'<div class="karten-nadel nadel--route' + (rand ? " nadel--rand" : "") + '"></div>' }) })
         .addTo(k).bindPopup("<b>" + sicher(pp.name) + "</b>" +
           (i === 0 ? "<br>Start" : i === punkte.length-1 ? "<br>Ziel" : ""));
      });
      /* Auch hier: die Route ins Bild holen und die Karte darauf begrenzen. */
      const strecke = L.latLngBounds(linie);
      k.fitBounds(strecke.pad(.15));
      const grenze = strecke.pad(.45);
      k.setMaxBounds(grenze);
      k.options.maxBoundsViscosity = 1;
      k.setMinZoom(k.getBoundsZoom(grenze));
    }
  }, { rootMargin:"200px" });
  routen.forEach((_, nr) => {
    const el = document.getElementById("route-" + nr);
    if(el) beobachter.observe(el);
  });
}

function karteBauen(){
  const orte = DATEN.orte || [];

  /* Liste immer aufbauen – sie funktioniert auch ohne Kartendienst */
  $("#orte-liste").innerHTML = orte.map((o, i) =>
    '<li data-nr="' + i + '"' + (o.art === "fern" ? ' class="ist-fern"' : "") +
    '><b>' + sicher(o.name) + "</b>" +
    '<span class="wann">' + sicher(o.jahr || "") + "</span>" +
    '<span class="was">' + sicher(o.text || "") + "</span></li>").join("");

  leafletLaden().then(async () => {

    const karte = L.map("karte", { scrollWheelZoom:true });
    karteObjekt = karte;
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom:18, attribution:"© OpenStreetMap"
    }).addTo(karte);
    karte.setView([50.17, 8.64], 11);          // erst einmal die Gegend zeigen

    /* Nadeln erscheinen, sobald ein Ort seine Koordinaten hat – die mit
       festen Werten sofort, die übrigen nach und nach. So starrt niemand
       auf eine leere Karte, während die Adressen gesucht werden.          */
    karteNadeln = [];
    const nadelZu = new Map();               // Ort → Nadel
    let wegLinie = null, wegNummern = [];

    const nadelSetzen = (o) => {
      if(nadelZu.has(o)) return;
      const nadel = L.marker([o.lat, o.lng], {
        icon: L.divIcon({
          className:"", iconSize:[16,16], iconAnchor:[8,8],
          html:'<div class="karten-nadel nadel--' + (o.art || "ort") + '"></div>'
        })
      }).addTo(karte);
      nadel.bindPopup("<b>" + sicher(o.name) + "</b><br>" +
                      (o.jahr ? sicher(o.jahr) + "<br>" : "") + sicher(o.text || ""));
      nadelZu.set(o, nadel);
      karteNadeln.push(nadel);
    };

    /* Der Weg durch die Wohnorte, in der Reihenfolge der Liste */
    const wegZeichnen = () => {
      const weg = orte.filter(o => o.art === "wohnort" && o.lat && o.lng);
      if(wegLinie) karte.removeLayer(wegLinie);
      wegNummern.forEach(n => karte.removeLayer(n));
      wegNummern = [];
      if(weg.length < 2) return;
      wegLinie = L.polyline(weg.map(o => [o.lat, o.lng]), {
        color:"#2a2722", weight:2.5, opacity:.75, dashArray:"1 9", lineCap:"round"
      }).addTo(karte);
      weg.forEach((o, i) => {
        wegNummern.push(L.marker([o.lat, o.lng], {
          icon: L.divIcon({
            className:"", iconSize:[22,22], iconAnchor:[-6,20],
            html:'<div class="weg-nummer">' + (i + 1) + "</div>"
          }), interactive:false
        }).addTo(karte));
      });
    };

    /* Alle Punkte ins Bild holen – und die Karte gleich darauf begrenzen.
       Man kann dann nur noch ein Stück über diese Ansicht hinaus schieben
       und nicht mehr weiter herauszoomen. Sonst landet man schnell bei
       ganz Deutschland, und die Punkte liegen als Häufchen in der Mitte. */
    const einpassen = () => {
      const alle = orte.filter(o => o.art !== "fern" && o.lat && o.lng);
      if(!alle.length) return;
      const punkte = L.latLngBounds(alle.map(o => [o.lat, o.lng]));
      karte.fitBounds(punkte.pad(.18));
      /* Etwas Luft drumherum, damit man die Randpunkte noch frei schieben
         kann – aber eben nur etwas.                                      */
      const grenze = punkte.pad(.6);
      karte.setMaxBounds(grenze);
      karte.options.maxBoundsViscosity = 1;      // hart an der Kante stoppen
      karte.setMinZoom(karte.getBoundsZoom(grenze));
    };

    /* Erste Runde: alles, was schon Koordinaten mitbringt */
    orte.filter(o => o.art !== "fern" && o.lat && o.lng).forEach(nadelSetzen);
    wegZeichnen();
    einpassen();

    /* Zweite Runde: Adressen auflösen, eine nach der anderen */
    for(const o of orte){
      if(o.art === "fern" || (o.lat && o.lng)) continue;
      if(!o.adresse || o.adresse === "Platzhalter") continue;
      const frisch = await adresseAufloesen(o.adresse);
      if(frisch){
        o.lat = frisch.lat; o.lng = frisch.lng;
        nadelSetzen(o);
        wegZeichnen();
        einpassen();
      }
      if(frisch && !frisch.gemerkt) await new Promise(r => setTimeout(r, 1100));
    }

    $("#orte-liste").addEventListener("click", e => {
      const li = e.target.closest("li");
      if(!li) return;
      const o = orte[+li.dataset.nr];
      if(!o.lat) return;
      karte.setView([o.lat, o.lng], 15, { animate:true });
      const nadel = nadelZu.get(o);
      if(nadel) nadel.openPopup();
      document.getElementById("karte").scrollIntoView({ behavior:"smooth", block:"center" });
    });
  }).catch(() => {
    document.getElementById("karte").innerHTML =
      '<div class="karten-fehler">Die Karte konnte nicht geladen werden – ohne Internet geht es nicht. Die Orte stehen unten in der Liste.</div>';
  });
}
